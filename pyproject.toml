[project]
name = "are-we-playing-scripts"
version = "0.1.0"
description = "Python scripts for the Are We Playing data pipeline"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

# Scripts only, nothing to build or install.
[tool.uv]
package = false

[tool.ruff]
src = ["src/scripts"]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
