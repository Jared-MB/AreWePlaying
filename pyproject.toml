[project]
name = "are-we-playing-scripts"
version = "0.1.0"
description = "Python scripts for the Are We Playing data pipeline"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "aiohttp>=3.14.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.14.0",
    "time-machine>=3.5.1",
]

# Scripts only, nothing to build or install.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]

[tool.ruff]
src = ["src/scripts"]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
